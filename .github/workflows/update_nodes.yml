name: Update QX Nodes for Mihomo

# 触发条件设置
on:
  workflow_dispatch: # 1. 允许你在网页上手动点击按钮运行
  schedule:
    - cron: '0 22 * * *' # 2. 定时自动运行（这里的 UTC 时间 22:00 相当于北京时间每天早上 6:00）

jobs:
  build:
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 虚拟环境
    
    # 赋予 GitHub Actions 推送代码的权限
    permissions:
      contents: write

    steps:
      # 1. 检出你的仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 配置 Python 运行环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装脚本需要的依赖库
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      # 4. 运行我们的节点转换脚本
      - name: Run Node Converter Script
        run: |
          python qx_node_converter.py

      # 5. 检查文件是否有变化，如果有则自动提交并推送到仓库
      - name: Commit and Push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add Mihomo_Proxies.yaml
          # 如果文件有更新，就提交；如果没更新，就不做处理跳过
          git diff --staged --quiet || (git commit -m "🚀 Auto update nodes: $(date +'%Y-%m-%d %H:%M')" && git push)
