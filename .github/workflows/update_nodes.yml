name: Update QX Nodes for Mihomo

# 触发条件设置
on:
  workflow_dispatch: # 允许你在网页上手动点击按钮运行
  schedule:
    # ⏱️ 彻底错开整点高峰！每天 6 次，每 4 小时在第 27 分触发
    # 物理运行时间 (UTC)：00:27, 04:27, 08:27, 12:27, 16:27, 20:27
    # 自动折算北京时间：08:27, 12:27, 16:27, 20:27, 00:27, 04:27
    - cron: '27 */4 * * *'

jobs:
  build:
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 虚拟环境
    
    # 赋予 GitHub Actions 推送代码的权限
    permissions:
      contents: write

    steps:
      # 1. 检出你的仓库代码
      - name: Checkout code
        uses: actions/checkout@main

      # 2. 配置 Python 运行环境
      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: '3.x'

      # 3. 安装脚本需要的依赖库
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      # 4. 运行我们的节点转换脚本
      - name: Run Node Converter Script
        run: |
          python qx_node_converter.py

      # 5. 检查文件是否有变化，如果有则自动提交并推送到仓库
      - name: Commit and Push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add Mihomo_Proxies.yaml
          # 如果文件有更新，就提交；如果没更新，就不做处理跳过
          git diff --staged --quiet || (git commit -m "🚀 Auto update nodes: $(date +'%Y-%m-%d %H:%M')" && git push)
